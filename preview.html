<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Todos Preview</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <h1>test_todos 목록</h1>
    <a class="home-link" href="index.html">홈으로</a>
    <ul id="todo-list" style="margin-top: 24px;"></ul>
  </div>

  <script>
    const SUPABASE_URL = "https://uqdwueoeqyhtzjrryrbo.supabase.co/rest/v1/";
    const SUPABASE_ANON_KEY = "sb_publishable_rJS2DRDe18CzICjXB7TsCA_lmgY6JTR";

    function escapeHtml(value) {
      const div = document.createElement("div");
      div.textContent = String(value);
      return div.innerHTML;
    }

    async function loadTodos() {
      const listEl = document.getElementById("todo-list");
      try {
        const res = await fetch(SUPABASE_URL + "test_todos?select=*", {
          headers: {
            apikey: SUPABASE_ANON_KEY,
            Authorization: "Bearer " + SUPABASE_ANON_KEY
          }
        });

        if (!res.ok) {
          throw new Error("HTTP " + res.status);
        }

        const todos = await res.json();

        if (todos.length === 0) {
          listEl.innerHTML = "<li>데이터가 없습니다.</li>";
          return;
        }

        listEl.innerHTML = todos
          .map((todo) => {
            const status = todo.done ? "완료" : "미완료";
            return `<li>
              <div class="field"><strong>${escapeHtml(todo.title)}</strong></div>
              <div class="field">수량: ${escapeHtml(todo.amount)}</div>
              <div class="field">상태: ${status}</div>
              <div class="field">마감일: ${escapeHtml(todo.due_date)}</div>
              <div class="field">생성일: ${escapeHtml(todo.created_at)}</div>
            </li>`;
          })
          .join("");
      } catch (err) {
        listEl.innerHTML = `<li>불러오기 실패: ${err.message}</li>`;
      }
    }

    loadTodos();
  </script>
</body>
</html>
